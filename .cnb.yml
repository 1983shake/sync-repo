# ============================================================================
# CNB 流水线配置
#   功能：
#     1. main 分支 push  -> 同步到 GitHub main
#     2. release-v* tag push ->
#          a. 在 CNB 创建 Release
#          b. 同步 tag 到 GitHub
#          c. 构建并推送 Docker 镜像（:版本号 + :latest）
#
#   密钥注入方式：密钥仓库文件 + imports
#     密钥仓库中的 envs.yml 提供 GITHUB_TOKEN 和 GITHUB_REPO
# ============================================================================

# ---------------------------- main 分支同步 ----------------------------
"main":
  push:
    - services:
        - docker
      imports:
        # 引用密钥仓库中的 envs.yml，其中的键值对自动注入为环境变量
        # - https://cnb.cool/1983shake/cnb-secrets/-/blob/main/envs.yml
        - https://cnb.cool/1983shake/secret-repo/-/blob/main/sync-repo-env.yml
      stages:
        - name: push main to github
          script: |
            set -e
            echo "==> 同步 main 到 GitHub"
            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
            git push github "HEAD:main" --force
            echo "==> main 同步完成"

# ------------------------ release-v* tag 流水线 ------------------------
"release-v*":
  tag_push:
    - services:
        - docker
      imports:
        # 同样的密钥文件，tag_push 场景也可引用
        # - https://cnb.cool/1983shake/cnb-secrets/-/blob/main/envs.yml
        - https://cnb.cool/1983shake/secret-repo/-/blob/main/sync-repo-env.yml
      stages:
        # 步骤 1：提取版本号并生成 Release 配置
        - name: prepare release
          script: |
            set -e
            VERSION="${CNB_BRANCH#release-v}"
            echo "版本号: ${VERSION}"
            cat > release-options.json <<EOF
            {
              "title": "Vael-Mux_V${VERSION}",
              "description": "Release Vael-Mux V${VERSION}"
            }
            EOF
            echo "生成的 Release 配置："
            cat release-options.json

        # 步骤 2：在 CNB 创建 Release
        - name: create release on cnb
          type: git:release
          optionsFrom: ./release-options.json

        # 步骤 3：同步 tag 到 GitHub
        - name: sync tag to github
          script: |
            set -e
            echo "==> 同步 tag ${CNB_BRANCH} 到 GitHub"
            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
            git push github \
              "refs/tags/${CNB_BRANCH}:refs/tags/${CNB_BRANCH}" --force
            echo "==> tag 同步完成"

        # 步骤 4：构建并推送 Docker 镜像
        - name: docker build and push
          script: |
            set -e
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH#release-v}"
            echo "==> 构建版本: ${VERSION}"
            docker build \
              -t "${IMAGE_BASE}:${VERSION}" \
              -t "${IMAGE_BASE}:latest" \
              .
            docker push "${IMAGE_BASE}:${VERSION}"
            docker push "${IMAGE_BASE}:latest"
            echo "==> 镜像推送完成: ${IMAGE_BASE}:${VERSION}"
            