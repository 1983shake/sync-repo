# ============================================================================
# 可修改变量（只改这里）
# 说明：
#   CNB 的 imports 在解析阶段执行，不能使用运行时 env 插值，
#   因此这里使用 YAML 锚点作为“变量”，正文通过 *锚点名 引用。
# ============================================================================
x-vars:
  # ⚠️ 需要修改：CNB 密钥仓库文件 URL
  secret_repo_url: &secret_repo_url "https://cnb.cool/1983shake/secret-repo/-/blob/main/sync-repo-env.yml"

  # 仅作集中备注；实际 GITHUB_REPO / GITHUB_TOKEN 由密钥文件注入
  github_repo: &github_repo "1983shake/sync-repo"
  cnb_repo: &cnb_repo "cnb.cool/1983shake/sync-repo.git"

# ============================================================================
# CNB 流水线配置
#   功能：
#     1. main 分支 push / commit.add -> 合并 GitHub 改动后推送 main（CNB 优先）
#     2. release-v* tag -> 规范化 CNB Release 标题（保留网页填写的描述）
#                        + 同步 tag 到 GitHub + 构建 Docker 镜像
#   引用：
#     密钥仓库 sync-repo-env.yml（提供 GITHUB_TOKEN / GITHUB_REPO）
#   触发时机：
#     - main 分支 push / commit.add
#     - release-v* 标签 push
# ============================================================================

# ============================================================================
# main 分支同步
# ============================================================================
"main":
  push:
    - imports:
        - *secret_repo_url
      stages:
        - name: push main to github (auto-merge + retry)
          script: |
            set -e
            echo "==> 触发事件: push"
            echo "==> 当前分支: ${CNB_BRANCH}"

            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

            for i in 1 2 3 4 5; do
              echo "------ 第 ${i} 次尝试 ------"
              git fetch github main || true

              if git rev-parse --verify github/main >/dev/null 2>&1; then
                if git diff --quiet HEAD github/main; then
                  echo "✅ CNB 与 GitHub 内容一致，无需同步"
                  exit 0
                fi
                echo "==> 合并 GitHub 上的独有改动（冲突时 CNB 优先）..."
                if ! git merge --no-edit -X ours github/main; then
                  echo "⚠️ 合并异常，放弃合并，直接用 CNB 覆盖 GitHub"
                  git merge --abort 2>/dev/null || true
                fi
              fi

              echo "==> 推送至 GitHub..."
              if git push github "HEAD:main" --force; then
                echo "✅ 推送成功"
                exit 0
              fi

              echo "⚠️ 推送失败（远端被并发更新），${i} 秒后重试..."
              sleep "$i"
            done

            echo "❌ 推送失败，已达最大重试次数。"
            exit 1

  commit.add:
    - imports:
        - *secret_repo_url
      stages:
        - name: sync new commits to github (auto-merge + retry)
          script: |
            set -e
            echo "==> 触发事件: commit.add"
            echo "==> 当前分支: ${CNB_BRANCH}"
            echo "==> 新增提交数: ${CNB_NEW_COMMITS_COUNT}"

            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

            for i in 1 2 3 4 5; do
              echo "------ 第 ${i} 次尝试 ------"
              git fetch github main || true

              if git rev-parse --verify github/main >/dev/null 2>&1; then
                if git diff --quiet HEAD github/main; then
                  echo "✅ CNB 与 GitHub 内容一致，无需同步"
                  exit 0
                fi
                echo "==> 合并 GitHub 上的独有改动（冲突时 CNB 优先）..."
                if ! git merge --no-edit -X ours github/main; then
                  echo "⚠️ 合并异常，放弃合并，直接用 CNB 覆盖 GitHub"
                  git merge --abort 2>/dev/null || true
                fi
              fi

              echo "==> 推送至 GitHub..."
              if git push github "HEAD:main" --force; then
                echo "✅ 推送成功"
                exit 0
              fi

              echo "⚠️ 推送失败（远端被并发更新），${i} 秒后重试..."
              sleep "$i"
            done

            echo "❌ 推送失败，已达最大重试次数。"
            exit 1

# ============================================================================
# release-v* 标签流水线
#   功能：
#     1. 规范化 CNB Release 标题为 "<项目名>_V<版本号>"，
#        同时保留网页"发布版本"时填写的描述；
#     2. 同步 tag 到 GitHub；
#     3. 构建并推送 Docker 镜像。
#
#   实现说明（重要）：
#     - CNB 不是 GitHub Actions，没有 $GITHUB_OUTPUT / steps.outputs 机制，
#       所有逻辑必须放在同一个 stage 内，用 shell 自己管理状态。
#     - 环境可能非常精简（连 python3 都没有），所有外部命令均先探测。
#     - 工具缺失或 API 异常时，直接跳过标题规范化，保留网页填写的内容。
# ============================================================================
"release-v*":
  tag_push:
    - services:
        - docker
      imports:
        - *secret_repo_url
      stages:
        # -----------------------------------------------------------------
        # 步骤 1：读取现有 Release 描述，规范化标题，更新 Release
        #   逻辑全部在一个 stage 内完成：
        #     探测工具 -> 拉取 API -> 解析 -> 决定是否 PATCH
        # -----------------------------------------------------------------
        - name: normalize release title (keep body)
          script: |
            set -e

            TAG_NAME="${CNB_TAG:-$CNB_BRANCH}"
            PROJECT_NAME="${GITHUB_REPO##*/}"
            if [ -z "$PROJECT_NAME" ]; then
              PROJECT_NAME="${CNB_REPO_NAME:-${CNB_REPO_SLUG##*/}}"
            fi
            VERSION="${TAG_NAME#release-v}"
            NEW_TITLE="${PROJECT_NAME}_V${VERSION}"

            echo "TAG_NAME:   ${TAG_NAME}"
            echo "项目名:     ${PROJECT_NAME}"
            echo "版本号:     ${VERSION}"
            echo "目标标题:   ${NEW_TITLE}"

            # =============================================================
            # 工具探测：curl / python3 / jq
            # =============================================================
            HAVE_CURL=0; command -v curl >/dev/null 2>&1 && HAVE_CURL=1
            PY=""
            if command -v python3 >/dev/null 2>&1; then PY=python3
            elif command -v python  >/dev/null 2>&1; then PY=python
            fi
            JQ=""
            command -v jq >/dev/null 2>&1 && JQ=jq

            echo "==> 工具检测: curl=${HAVE_CURL} python=${PY:-无} jq=${JQ:-无}"

            if [ "${HAVE_CURL}" != "1" ]; then
              echo "⚠️ 无 curl，跳过标题规范化，保留网页内容"
              exit 0
            fi
            if [ -z "${PY}" ] && [ -z "${JQ}" ]; then
              echo "⚠️ 无 python 也无 jq，跳过标题规范化，保留网页内容"
              exit 0
            fi

            # =============================================================
            # 拉取 Releases 列表
            # ⚠️ 若你的 CNB 版本 API 路径不同，按实际返回 200 的 URL 调整：
            #    ${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/releases
            #    ${CNB_API_ENDPOINT}/repos/${CNB_REPO_SLUG}/releases
            #    ${CNB_API_ENDPOINT}/repos/${CNB_REPO_SLUG}/-/releases
            # =============================================================
            RELEASES_URL="${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/releases"
            echo "==> 查询 CNB Releases: ${RELEASES_URL}"

            HTTP_CODE="$(curl -s -o /tmp/releases.json -w '%{http_code}' \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "accept: application/json" \
              "${RELEASES_URL}" 2>/dev/null || echo 000)"
            echo "==> HTTP 状态码: ${HTTP_CODE}"

            if [ "${HTTP_CODE}" != "200" ]; then
              echo "⚠️ Releases API 未返回 200，跳过标题规范化，保留网页内容"
              exit 0
            fi

            # =============================================================
            # 解析：取出 tag 匹配的 Release 的描述
            #   优先 jq，其次 python，都没有则已在上面 exit 0
            # =============================================================
            RELEASE_DESC=""
            FOUND=0

            if [ -n "${JQ}" ]; then
              echo "==> 使用 jq 解析"
              FOUND="$(${JQ} -r --arg tag "${TAG_NAME}" '
                (if type == "array" then . else (.releases // []) end)
                | map(select((.tag_name // .tag) == $tag))
                | length
              ' /tmp/releases.json 2>/dev/null || echo 0)"
              if [ -n "${FOUND}" ] && [ "${FOUND}" != "0" ]; then
                RELEASE_DESC="$(${JQ} -r --arg tag "${TAG_NAME}" '
                  (if type == "array" then . else (.releases // []) end)
                  | map(select((.tag_name // .tag) == $tag))
                  | (.[0] // {})
                  | (.body // .description // .desc // .notes // "")
                ' /tmp/releases.json 2>/dev/null || true)"
              fi
            elif [ -n "${PY}" ]; then
              echo "==> 使用 ${PY} 解析"
              EXTRACT="$(TAG_NAME="${TAG_NAME}" "${PY}" - /tmp/releases.json <<'PYEOF'
import json, os, sys
tag = os.environ["TAG_NAME"]
try:
    with open(sys.argv[1], encoding="utf-8") as f:
        data = json.load(f)
except Exception:
    sys.exit(0)
items = data if isinstance(data, list) else (data or {}).get("releases", [])
for r in items:
    if r.get("tag_name") == tag or r.get("tag") == tag:
        desc = (r.get("body") or r.get("description")
                or r.get("desc") or r.get("notes") or "")
        sys.stdout.write("1\n" + desc)
        sys.exit(0)
sys.stdout.write("0\n")
PYEOF
)"
              FOUND="$(printf '%s' "${EXTRACT}" | head -n 1)"
              RELEASE_DESC="$(printf '%s' "${EXTRACT}" | tail -n +2)"
            fi

            echo "==> 匹配标记: ${FOUND}"
            echo "==> 提取到的描述: [${RELEASE_DESC}]"

            if [ "${FOUND}" != "1" ]; then
              echo "⚠️ 未匹配到 tag=${TAG_NAME} 的 Release，跳过标题规范化"
              exit 0
            fi

            # =============================================================
            # 直接调用 CNB API 更新 Release 的标题（描述保持不变）
            # ⚠️ 端点因 CNB 版本而异，常见两种：
            #    PATCH ${CNB_API_ENDPOINT}/repos/${CNB_REPO_SLUG}/releases/tags/${TAG_NAME}
            #    PATCH ${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/releases/tags/${TAG_NAME}
            #    body 字段名可能是 name/title、body/description，
            #    若报 400，请按返回信息调整下面的 JSON。
            # =============================================================
            UPDATE_URL="${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/releases/tags/${TAG_NAME}"
            echo "==> 更新 Release 标题: ${UPDATE_URL}"

            # 用 python 或 jq 生成合法的 JSON body（处理转义）
            if [ -n "${PY}" ]; then
              NEW_TITLE="${NEW_TITLE}" RELEASE_DESC="${RELEASE_DESC}" \
                "${PY}" - <<'PYEOF'
import json, os
payload = {"title": os.environ["NEW_TITLE"], "body": os.environ["RELEASE_DESC"]}
with open("/tmp/patch.json", "w", encoding="utf-8") as f:
    json.dump(payload, f, ensure_ascii=False)
PYEOF
            else
              ${JQ} -n --arg t "${NEW_TITLE}" --arg b "${RELEASE_DESC}" \
                '{title:$t, body:$b}' > /tmp/patch.json
            fi

            echo "==> PATCH body:"
            cat /tmp/patch.json

            PATCH_CODE="$(curl -s -o /tmp/patch.resp -w '%{http_code}' \
              -X PATCH \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "accept: application/json" \
              --data-binary @/tmp/patch.json \
              "${UPDATE_URL}" 2>/dev/null || echo 000)"
            echo "==> PATCH 状态码: ${PATCH_CODE}"
            head -c 500 /tmp/patch.resp 2>/dev/null; echo

            if [ "${PATCH_CODE}" = "200" ] || [ "${PATCH_CODE}" = "201" ]; then
              echo "✅ Release 标题已规范化为: ${NEW_TITLE}"
            else
              echo "⚠️ 更新失败（HTTP ${PATCH_CODE}），网页内容保持不变"
              # 不 exit 1：规范化失败不应阻断后续 Docker 构建
            fi

        # -----------------------------------------------------------------
        # 步骤 2：将 tag 同步到 GitHub
        # -----------------------------------------------------------------
        - name: sync tag to github
          script: |
            set -e
            TAG_NAME="${CNB_TAG:-$CNB_BRANCH}"

            echo "==> 同步 tag ${TAG_NAME} 到 GitHub"
            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

            for i in 1 2 3 4 5; do
              if git push github \
                "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}" --force; then
                echo "✅ tag 推送成功"
                exit 0
              fi
              echo "⚠️ tag 推送失败，${i} 秒后重试..."
              sleep "$i"
            done
            echo "❌ tag 推送失败"
            exit 1

        # -----------------------------------------------------------------
        # 步骤 3：构建并推送 Docker 镜像
        # -----------------------------------------------------------------
        - name: docker build and push
          script: |
            set -e
            TAG_NAME="${CNB_TAG:-$CNB_BRANCH}"
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${TAG_NAME#release-v}"
            echo "==> 构建版本: ${VERSION}"

            # ⚠️ 可选：如需把版本号注入镜像，取消注释并在 Dockerfile 声明 ARG
            # docker build --build-arg APP_VERSION="${VERSION}" \
            docker build \
              -t "${IMAGE_BASE}:${VERSION}" \
              -t "${IMAGE_BASE}:latest" \
              .
            docker push "${IMAGE_BASE}:${VERSION}"
            docker push "${IMAGE_BASE}:latest"
            echo "==> 镜像推送完成: ${IMAGE_BASE}:${VERSION}"