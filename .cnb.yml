# ============================================================================
# 可修改变量（只改这里）
# ============================================================================
x-vars:
  # ⚠️ 需要修改：CNB 密钥仓库文件 URL
  secret_repo_url: &secret_repo_url "https://cnb.cool/1983shake/secret-repo/-/blob/main/sync-repo-env.yml"

  github_repo: &github_repo "1983shake/sync-repo"
  cnb_repo: &cnb_repo "cnb.cool/1983shake/sync-repo.git"

# ============================================================================
# CNB 流水线配置
#   功能：
#     1. main 分支 push / commit.add -> 合并 GitHub 改动后推送 main（CNB 优先）
#     2. release-v* tag -> 规范化 CNB Release 标题（保留网页填写的描述）
#                        + 同步 tag 到 GitHub + 构建 Docker 镜像
# ============================================================================

# ============================================================================
# main 分支同步
# ============================================================================
"main":
  push:
    - imports:
        - *secret_repo_url
      stages:
        - name: push main to github (auto-merge + retry)
          script: |
            set -e
            echo "==> 触发事件: push"
            echo "==> 当前分支: ${CNB_BRANCH}"

            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

            for i in 1 2 3 4 5; do
              echo "------ 第 ${i} 次尝试 ------"
              git fetch github main || true

              if git rev-parse --verify github/main >/dev/null 2>&1; then
                if git diff --quiet HEAD github/main; then
                  echo "✅ CNB 与 GitHub 内容一致，无需同步"
                  exit 0
                fi
                echo "==> 合并 GitHub 上的独有改动（冲突时 CNB 优先）..."
                if ! git merge --no-edit -X ours github/main; then
                  echo "⚠️ 合并异常，放弃合并，直接用 CNB 覆盖 GitHub"
                  git merge --abort 2>/dev/null || true
                fi
              fi

              echo "==> 推送至 GitHub..."
              if git push github "HEAD:main" --force; then
                echo "✅ 推送成功"
                exit 0
              fi

              echo "⚠️ 推送失败（远端被并发更新），${i} 秒后重试..."
              sleep "$i"
            done

            echo "❌ 推送失败，已达最大重试次数。"
            exit 1

  commit.add:
    - imports:
        - *secret_repo_url
      stages:
        - name: sync new commits to github (auto-merge + retry)
          script: |
            set -e
            echo "==> 触发事件: commit.add"
            echo "==> 当前分支: ${CNB_BRANCH}"
            echo "==> 新增提交数: ${CNB_NEW_COMMITS_COUNT}"

            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

            for i in 1 2 3 4 5; do
              echo "------ 第 ${i} 次尝试 ------"
              git fetch github main || true

              if git rev-parse --verify github/main >/dev/null 2>&1; then
                if git diff --quiet HEAD github/main; then
                  echo "✅ CNB 与 GitHub 内容一致，无需同步"
                  exit 0
                fi
                echo "==> 合并 GitHub 上的独有改动（冲突时 CNB 优先）..."
                if ! git merge --no-edit -X ours github/main; then
                  echo "⚠️ 合并异常，放弃合并，直接用 CNB 覆盖 GitHub"
                  git merge --abort 2>/dev/null || true
                fi
              fi

              echo "==> 推送至 GitHub..."
              if git push github "HEAD:main" --force; then
                echo "✅ 推送成功"
                exit 0
              fi

              echo "⚠️ 推送失败（远端被并发更新），${i} 秒后重试..."
              sleep "$i"
            done

            echo "❌ 推送失败，已达最大重试次数。"
            exit 1

# ============================================================================
# release-v* 标签流水线
#   功能：
#     1. 规范化 CNB Release 标题为 "<项目名>_V<版本号>"
#     2. 同步 tag 到 GitHub
#     3. 构建并推送 Docker 镜像
#
#   核心策略：
#     - 在同一 stage 内生成 release-options.json（含 tag/title/body）
#       彻底避免跨 stage 变量不传递的问题
#     - 用 optionsFrom 读取 JSON，让 git:release 使用正确的 title
# ============================================================================
"release-v*":
  tag_push:
    - services:
        - docker
      imports:
        - *secret_repo_url
      stages:
        # -----------------------------------------------------------------
        # 步骤 1：生成 release-options.json
        #   包含 tag / title / body（网页填写的描述，若提取不到则为空）
        # -----------------------------------------------------------------
        - name: prepare release options
          script: |
            set -e

            TAG_NAME="${CNB_TAG:-$CNB_BRANCH}"
            PROJECT_NAME="${GITHUB_REPO##*/}"
            VERSION="${TAG_NAME#release-v}"
            NEW_TITLE="${PROJECT_NAME}_V${VERSION}"

            echo "==> TAG:      ${TAG_NAME}"
            echo "==> 项目名:   ${PROJECT_NAME}"
            echo "==> 版本号:   ${VERSION}"
            echo "==> 目标标题: ${NEW_TITLE}"

            # ---------- JSON 工具探测 ----------
            JSON_TOOL=""
            if   command -v python3 >/dev/null 2>&1; then JSON_TOOL=python3
            elif command -v python  >/dev/null 2>&1; then JSON_TOOL=python
            elif command -v jq      >/dev/null 2>&1; then JSON_TOOL=jq
            fi
            echo "==> JSON 工具: ${JSON_TOOL:-无}"

            # ---------- 读取网页填写的描述 ----------
            DESC=""

            if [ -n "${JSON_TOOL}" ]; then
              URL="${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/releases"
              echo "==> 拉取 Releases: ${URL}"

              CODE="$(curl -s -o /tmp/releases.json -w '%{http_code}' \
                -H "Authorization: Bearer ${CNB_TOKEN}" \
                -H "accept: application/json" \
                "${URL}" 2>/dev/null || echo 000)"
              echo "==> API HTTP: ${CODE}"

              if [ "${CODE}" = "200" ]; then
                echo "==> 原始响应（前 2000 字符）:"
                head -c 2000 /tmp/releases.json
                echo

                if [ "${JSON_TOOL}" = "jq" ]; then
                  DESC="$(jq -r --arg tag "${TAG_NAME}" '
            (if type=="array" then . else (.releases // []) end)
            | map(select((.tag_name // .tag)==$tag))
            | (.[0] // {})
            | (.body // .description // .desc // .notes // "")
            ' /tmp/releases.json 2>/dev/null || true)"
                else
                  DESC="$("${JSON_TOOL}" -c '
            import json, sys
            tag = sys.argv[1]
            try:
                with open("/tmp/releases.json") as f:
                    data = json.load(f)
            except Exception:
                sys.exit(0)
            items = data if isinstance(data, list) else (data or {}).get("releases", [])
            for r in items:
                if r.get("tag_name") == tag or r.get("tag") == tag:
                    sys.stdout.write(r.get("body") or r.get("description")
                                     or r.get("desc") or r.get("notes") or "")
                    break
            ' "${TAG_NAME}" 2>/dev/null || true)"
                fi

                echo "==> 提取到的描述: [${DESC}]"
              fi
            else
              echo "==> 无 JSON 工具，跳过描述读取（body 将为空）"
            fi

            # ---------- 转义 JSON 特殊字符 ----------
            # 把 \ 换成 \\，把 " 换成 \"，把换行换成空格
            escape_json() {
              printf '%s' "$1" \
                | tr '\n' ' ' \
                | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'
            }

            SAFE_TAG="$(escape_json "${TAG_NAME}")"
            SAFE_TITLE="$(escape_json "${NEW_TITLE}")"
            SAFE_DESC="$(escape_json "${DESC}")"

            # ---------- 生成 release-options.json（单行）----------
            printf '{"tag":"%s","title":"%s","body":"%s"}' \
              "${SAFE_TAG}" "${SAFE_TITLE}" "${SAFE_DESC}" \
              > release-options.json

            echo "==> 生成的 release-options.json:"
            cat release-options.json
            echo

        # -----------------------------------------------------------------
        # 步骤 2：用 optionsFrom 读取 JSON，规范化 Release 标题
        # -----------------------------------------------------------------
        - name: normalize release title
          type: git:release
          optionsFrom: ./release-options.json

        # -----------------------------------------------------------------
        # 步骤 3：同步 tag 到 GitHub
        # -----------------------------------------------------------------
        - name: sync tag to github
          script: |
            set -e
            TAG_NAME="${CNB_TAG:-$CNB_BRANCH}"

            echo "==> 同步 tag ${TAG_NAME} 到 GitHub"
            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

            for i in 1 2 3 4 5; do
              if git push github \
                "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}" --force; then
                echo "✅ tag 推送成功"
                exit 0
              fi
              echo "⚠️ tag 推送失败，${i} 秒后重试..."
              sleep "$i"
            done
            echo "❌ tag 推送失败"
            exit 1

        # -----------------------------------------------------------------
        # 步骤 4：构建并推送 Docker 镜像
        # -----------------------------------------------------------------
        - name: docker build and push
          script: |
            set -e
            TAG_NAME="${CNB_TAG:-$CNB_BRANCH}"
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${TAG_NAME#release-v}"
            echo "==> 构建版本: ${VERSION}"

            # ⚠️ 可选：把版本号注入镜像时取消注释，并在 Dockerfile 声明 ARG APP_VERSION
            # docker build --build-arg APP_VERSION="${VERSION}" \
            docker build \
              -t "${IMAGE_BASE}:${VERSION}" \
              -t "${IMAGE_BASE}:latest" \
              .
            docker push "${IMAGE_BASE}:${VERSION}"
            docker push "${IMAGE_BASE}:latest"
            echo "==> 镜像推送完成: ${IMAGE_BASE}:${VERSION}"