# ============================================================================
# 可修改变量（只改这里）
# ============================================================================
x-vars:
  # ⚠️ 需要修改：CNB 密钥仓库文件 URL
  secret_repo_url: &secret_repo_url "https://cnb.cool/1983shake/secret-repo/-/blob/main/sync-repo-env.yml"

  github_repo: &github_repo "1983shake/sync-repo"
  cnb_repo: &cnb_repo "cnb.cool/1983shake/sync-repo.git"

# ============================================================================
# CNB 流水线配置
#   功能：
#     1. main 分支 push / commit.add -> 合并 GitHub 改动后推送 main（CNB 优先）
#     2. release-v* tag -> 规范化 CNB Release 标题（保留网页填写的描述）
#                        + 同步 tag 到 GitHub + 构建 Docker 镜像
# ============================================================================

# ============================================================================
# main 分支同步
# ============================================================================
"main":
  push:
    - imports:
        - *secret_repo_url
      stages:
        - name: push main to github (auto-merge + retry)
          script: |
            set -e
            echo "==> 触发事件: push"
            echo "==> 当前分支: ${CNB_BRANCH}"

            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

            for i in 1 2 3 4 5; do
              echo "------ 第 ${i} 次尝试 ------"
              git fetch github main || true

              if git rev-parse --verify github/main >/dev/null 2>&1; then
                if git diff --quiet HEAD github/main; then
                  echo "✅ CNB 与 GitHub 内容一致，无需同步"
                  exit 0
                fi
                echo "==> 合并 GitHub 上的独有改动（冲突时 CNB 优先）..."
                if ! git merge --no-edit -X ours github/main; then
                  echo "⚠️ 合并异常，放弃合并，直接用 CNB 覆盖 GitHub"
                  git merge --abort 2>/dev/null || true
                fi
              fi

              echo "==> 推送至 GitHub..."
              if git push github "HEAD:main" --force; then
                echo "✅ 推送成功"
                exit 0
              fi

              echo "⚠️ 推送失败（远端被并发更新），${i} 秒后重试..."
              sleep "$i"
            done

            echo "❌ 推送失败，已达最大重试次数。"
            exit 1

  commit.add:
    - imports:
        - *secret_repo_url
      stages:
        - name: sync new commits to github (auto-merge + retry)
          script: |
            set -e
            echo "==> 触发事件: commit.add"
            echo "==> 当前分支: ${CNB_BRANCH}"
            echo "==> 新增提交数: ${CNB_NEW_COMMITS_COUNT}"

            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

            for i in 1 2 3 4 5; do
              echo "------ 第 ${i} 次尝试 ------"
              git fetch github main || true

              if git rev-parse --verify github/main >/dev/null 2>&1; then
                if git diff --quiet HEAD github/main; then
                  echo "✅ CNB 与 GitHub 内容一致，无需同步"
                  exit 0
                fi
                echo "==> 合并 GitHub 上的独有改动（冲突时 CNB 优先）..."
                if ! git merge --no-edit -X ours github/main; then
                  echo "⚠️ 合并异常，放弃合并，直接用 CNB 覆盖 GitHub"
                  git merge --abort 2>/dev/null || true
                fi
              fi

              echo "==> 推送至 GitHub..."
              if git push github "HEAD:main" --force; then
                echo "✅ 推送成功"
                exit 0
              fi

              echo "⚠️ 推送失败（远端被并发更新），${i} 秒后重试..."
              sleep "$i"
            done

            echo "❌ 推送失败，已达最大重试次数。"
            exit 1

# ============================================================================
# release-v* 标签流水线
#   功能：
#     1. 规范化 CNB Release 标题为 "<项目名>_V<版本号>"，保留网页描述
#     2. 同步 tag 到 GitHub
#     3. 构建并推送 Docker 镜像
#
#   核心修正：
#     - git:release 使用 title 字段（不是 name）
#     - 描述文件写入 CNB_BUILD_WORKSPACE，通过 exports 传递路径
#     - PROJECT_NAME / VERSION 通过 exports 传递给 git:release
# ============================================================================
"release-v*":
  tag_push:
    - services:
        - docker
      imports:
        - *secret_repo_url
      stages:
        # -----------------------------------------------------------------
        # 步骤 1：读取网页填写的描述，规范化标题，写入共享工作区
        # -----------------------------------------------------------------
        - name: fetch release description and prepare title
          id: prepare
          script: |
            set -e

            TAG_NAME="${CNB_TAG:-$CNB_BRANCH}"
            echo "==> 正在获取 Release 描述，tag: ${TAG_NAME}"

            # 项目名：优先从 GITHUB_REPO 提取，兜底用 CNB 仓库名
            PROJECT_NAME="${GITHUB_REPO##*/}"
            if [ -z "$PROJECT_NAME" ]; then
              PROJECT_NAME="${CNB_REPO_NAME:-${CNB_REPO_SLUG##*/}}"
            fi

            VERSION="${TAG_NAME#release-v}"
            NEW_TITLE="${PROJECT_NAME}_V${VERSION}"

            echo "==> 项目名: ${PROJECT_NAME}"
            echo "==> 版本号: ${VERSION}"
            echo "==> 目标标题: ${NEW_TITLE}"

            # 尝试多种 API 路径读取网页填写的描述
            API_PATHS=""
            API_PATHS="${API_PATHS} ${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/releases"
            API_PATHS="${API_PATHS} ${CNB_API_ENDPOINT}/repos/${CNB_REPO_SLUG}/releases"

            DESC=""
            HTTP_OK=0

            for url in ${API_PATHS}; do
              echo "==> 尝试: ${url}"
              CODE="$(curl -s -o /tmp/releases.json -w '%{http_code}' \
                -H "Authorization: Bearer ${CNB_TOKEN}" \
                -H "accept: application/json" \
                "${url}" 2>/dev/null || echo 000)"
              echo "    HTTP ${CODE}"

              if [ "${CODE}" = "200" ]; then
                HTTP_OK=1
                if command -v grep >/dev/null 2>&1; then
                  DESC="$(grep -o "\"tag_name\":\"${TAG_NAME}\"[^}]*\"description\":\"[^\"]*\"" \
                    /tmp/releases.json 2>/dev/null | \
                    sed 's/.*"description":"\([^"]*\)".*/\1/' | head -n 1 || true)"
                fi
                break
              fi
            done

            if [ "${HTTP_OK}" != "1" ]; then
              echo "⚠️ 未能获取 Releases API，跳过标题规范化，保留网页内容"
              exit 0
            fi

            echo "==> 提取到的描述: [${DESC}]"

            # 写入共享工作区
            # printf '%s' "${DESC}" > "${CNB_BUILD_WORKSPACE}/release-desc.txt"
            printf '%s' "${DESC}" > "release-desc.txt"
            # echo "==> 描述已保存到 ${CNB_BUILD_WORKSPACE}/release-desc.txt"
            echo "==> 描述已保存到 release-desc.txt"

            # ⚠️ 关键：导出后续任务需要的变量
            echo "${NEW_TITLE}" > "${CNB_BUILD_WORKSPACE}/new-title.txt"
            echo "==> 标题已保存到 ${CNB_BUILD_WORKSPACE}/new-title.txt"

        # -----------------------------------------------------------------
        # 步骤 2：用 git:release 规范化 Release 标题，保留网页描述
        #   使用 title 字段（不是 name）
        #   descriptionFromFile 指向共享工作区文件
        # -----------------------------------------------------------------
        - name: normalize release title
          type: git:release
          options:
            tag: "${CNB_TAG:-$CNB_BRANCH}"
            title: "${PROJECT_NAME}_V${VERSION}"
            # descriptionFromFile: "${CNB_BUILD_WORKSPACE}/release-desc.txt"
            descriptionFromFile: "release-desc.txt"
          exports:
            # 从共享工作区读取标题，确保变量在后续任务中可用
            # 注：如果 title 变量在此处不可用，可通过 cnb:read-file 插件读取
            _: ""

        # -----------------------------------------------------------------
        # 步骤 3：同步 tag 到 GitHub
        # -----------------------------------------------------------------
        - name: sync tag to github
          script: |
            set -e
            TAG_NAME="${CNB_TAG:-$CNB_BRANCH}"

            echo "==> 同步 tag ${TAG_NAME} 到 GitHub"
            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

            for i in 1 2 3 4 5; do
              if git push github \
                "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}" --force; then
                echo "✅ tag 推送成功"
                exit 0
              fi
              echo "⚠️ tag 推送失败，${i} 秒后重试..."
              sleep "$i"
            done
            echo "❌ tag 推送失败"
            exit 1

        # -----------------------------------------------------------------
        # 步骤 4：构建并推送 Docker 镜像
        # -----------------------------------------------------------------
        - name: docker build and push
          script: |
            set -e
            TAG_NAME="${CNB_TAG:-$CNB_BRANCH}"
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${TAG_NAME#release-v}"
            echo "==> 构建版本: ${VERSION}"

            # ⚠️ 可选：把版本号注入镜像时取消注释，并在 Dockerfile 声明 ARG APP_VERSION
            # docker build --build-arg APP_VERSION="${VERSION}" \
            docker build \
              -t "${IMAGE_BASE}:${VERSION}" \
              -t "${IMAGE_BASE}:latest" \
              .
            docker push "${IMAGE_BASE}:${VERSION}"
            docker push "${IMAGE_BASE}:latest"
            echo "==> 镜像推送完成: ${IMAGE_BASE}:${VERSION}"