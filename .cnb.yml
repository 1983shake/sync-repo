"main":
  push:
    - imports:
        - https://cnb.cool/1983shake/secret-repo/-/blob/main/sync-repo-env.yml
      stages:
        - name: push main to github
          script: |
            set -e
            echo "==> 触发事件: push"
            echo "==> 当前分支: ${CNB_BRANCH}"
            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
            echo "==> 拉取 GitHub 最新更改..."
            git fetch github main
            git rebase github/main || {
              echo "❌ Rebase 失败，可能存在合并冲突，请手动处理。"
              exit 1
            }
            for i in 1 2 3; do
              echo "==> 尝试推送 (第 ${i} 次)..."
              if git push github "HEAD:main" --force-with-lease; then
                echo "✅ 推送成功"
                break
              else
                echo "⚠️ 推送失败，等待 ${i}0 秒后重试..."
                sleep ${i}0
                git fetch github main
                git rebase github/main || {
                  echo "❌ Rebase 失败，可能存在合并冲突，请手动处理。"
                  exit 1
                }
              fi
              if [ $i -eq 3 ]; then
                echo "❌ 推送失败，已达最大重试次数。"
                exit 1
              fi
            done
            echo "==> main 同步完成"
  commit.add:
    - imports:
        - https://cnb.cool/1983shake/secret-repo/-/blob/main/sync-repo-env.yml
      stages:
        - name: sync new commits to github
          script: |
            set -e
            echo "==> 触发事件: commit.add"
            echo "==> 当前分支: ${CNB_BRANCH}"
            echo "==> 新增提交数: ${CNB_NEW_COMMITS_COUNT}"
            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
            echo "==> 拉取 GitHub 最新更改..."
            git fetch github main
            git rebase github/main || {
              echo "❌ Rebase 失败，可能存在合并冲突，请手动处理。"
              exit 1
            }
            for i in 1 2 3; do
              echo "==> 尝试推送 (第 ${i} 次)..."
              if git push github "HEAD:main" --force-with-lease; then
                echo "✅ 推送成功"
                break
              else
                echo "⚠️ 推送失败，等待 ${i}0 秒后重试..."
                sleep ${i}0
                git fetch github main
                git rebase github/main || {
                  echo "❌ Rebase 失败，可能存在合并冲突，请手动处理。"
                  exit 1
                }
              fi
              if [ $i -eq 3 ]; then
                echo "❌ 推送失败，已达最大重试次数。"
                exit 1
              fi
            done
            echo "==> main 同步完成"

"release-v*":
  tag_push:
    - services:
        - docker
      imports:
        - https://cnb.cool/1983shake/secret-repo/-/blob/main/sync-repo-env.yml
      stages:
        - name: prepare release
          script: |
            set -e
            PROJECT_NAME="${GITHUB_REPO##*/}"
            if [ -z "$PROJECT_NAME" ]; then
              PROJECT_NAME="${CNB_REPO_NAME:-${CNB_REPO_SLUG##*/}}"
            fi
            VERSION="${CNB_BRANCH#release-v}"
            echo "项目名: ${PROJECT_NAME}"
            echo "版本号: ${VERSION}"
            cat > release-options.json <<EOF
            {
              "title": "${PROJECT_NAME}_V${VERSION}",
              "description": "Release ${PROJECT_NAME} V${VERSION}"
            }
            EOF
            echo "生成的 Release 配置："
            cat release-options.json

        - name: create release on cnb
          type: git:release
          optionsFrom: ./release-options.json

        - name: sync tag to github
          script: |
            set -e
            echo "==> 同步 tag ${CNB_BRANCH} 到 GitHub"
            git remote remove github 2>/dev/null || true
            git remote add github \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
            for i in 1 2 3; do
              echo "==> 尝试推送标签 (第 ${i} 次)..."
              if git push github \
                "refs/tags/${CNB_BRANCH}:refs/tags/${CNB_BRANCH}" --force; then
                echo "✅ 标签推送成功"
                break
              else
                echo "⚠️ 标签推送失败，等待 ${i}0 秒后重试..."
                sleep ${i}0
              fi
              if [ $i -eq 3 ]; then
                echo "❌ 标签推送失败，已达最大重试次数。"
                exit 1
              fi
            done
            echo "==> tag 同步完成"

        - name: docker build and push
          script: |
            set -e
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH#release-v}"
            echo "==> 构建版本: ${VERSION}"
            docker build \
              -t "${IMAGE_BASE}:${VERSION}" \
              -t "${IMAGE_BASE}:latest" \
              .
            docker push "${IMAGE_BASE}:${VERSION}"
            docker push "${IMAGE_BASE}:latest"
            echo "==> 镜像推送完成: ${IMAGE_BASE}:${VERSION}"